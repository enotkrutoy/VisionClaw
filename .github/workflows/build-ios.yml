name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Secrets (From Official Quick Start)
        run: |
          cd samples/CameraAccess
          # Копируем пример файла секретов, чтобы Xcode нашел его при компиляции
          cp CameraAccess/Secrets.swift.example CameraAccess/Secrets.swift

      - name: Create Global Override xcconfig
        run: |
          cd samples/CameraAccess
          cat << 'EOF' > override.xcconfig
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          AD_HOC_CODE_SIGNING_ALLOWED = NO
          CODE_SIGN_IDENTITY = 
          CODE_SIGN_ENTITLEMENTS = 
          DEVELOPMENT_TEAM = 
          PROVISIONING_PROFILE_SPECIFIER = 
          ENTITLEMENTS_REQUIRED = NO
          ENABLE_USER_SCRIPT_SANDBOXING = NO
          VALIDATE_WORKSPACE = NO
          EOF

      - name: Resolve Swift Packages
        run: |
          cd samples/CameraAccess
          xcodebuild -resolvePackageDependencies -project CameraAccess.xcodeproj -scheme CameraAccess

      - name: Build Xcode Project (Bypass Codesign)
        run: |
          cd samples/CameraAccess
          xcodebuild clean build \
                     -project CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -sdk iphoneos \
                     -configuration Release \
                     -arch arm64 \
                     -xcconfig override.xcconfig \
                     CODESIGN=/usr/bin/true \
                     CODESIGN_ALLOCATE=/usr/bin/true \
                     -derivedDataPath build

      - name: Create IPA Package
        run: |
          cd samples/CameraAccess
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App bundle not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r CameraAccess.ipa Payload

      - name: Show Detailed Log on Failure
        if: failure()
        run: |
          echo "=== DETAILED XCODEBUILD LOG ==="
          find samples/CameraAccess/build -name "*.xcresult" -exec xcrun xcresulttool get --format json --path {} \; 2>/dev/null | grep -i "error" | head -n 100 || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-IPA
          path: samples/CameraAccess/CameraAccess.ipa
