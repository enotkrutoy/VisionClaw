name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Swift Packages
        run: |
          cd samples/CameraAccess
          xcodebuild -resolvePackageDependencies -project CameraAccess.xcodeproj -scheme CameraAccess

      - name: Clean and Build Xcode Project
        run: |
          cd samples/CameraAccess
          xcodebuild clean build \
                     -project CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     CODE_SIGN_STYLE=Manual \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     ENTITLEMENTS_REQUIRED=NO \
                     -derivedDataPath build

      - name: Create IPA Package
        run: |
          cd samples/CameraAccess
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r CameraAccess.ipa Payload

      - name: Show Detailed Log on Failure
        if: failure()
        run: |
          echo "=== BUILD ERROR DETAILS ==="
          find samples/CameraAccess/build -name "*.xcresult" -exec xcrun xcresulttool get --format json --path {} \; 2>/dev/null | grep -i "error" | head -n 50 || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-IPA
          path: samples/CameraAccess/CameraAccess.ipa
