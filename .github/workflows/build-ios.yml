name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Xcode Project
        run: |
          cd samples/CameraAccess
          xcodebuild -project CameraAccess.xcodeproj \
                     -scheme CameraAccess \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     -derivedDataPath build

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r samples/CameraAccess/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r CameraAccess.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-IPA
          path: CameraAccess.ipa
